<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reconciliation Console — Users &amp; Access</title>
<!-- <link rel="stylesheet" href="/static/style.css?v=7"> -->
</head>
<body>
<header class="masthead">
  <div class="title">Reconciliation Console<small>Abronal ⇄ Source-of-Truth</small></div>
  <div class="header-right">
    <nav class="tabs">
      <a href="/">Intake &amp; Run</a>
      <a href="/evaluation">Evaluation</a>
      <a href="/admin" class="active">Admin</a>
    </nav>
    <div class="user-chip" id="userChip"></div>
  </div>
</header>

<main>
  <p class="meta-line" style="margin:-6px 0 18px;"><a href="/admin">← Admin</a></p>

  <div class="card">
    <h2>Create User</h2>
    <div class="filters-row">
      <div class="field">
        <label>Username</label>
        <input type="text" id="newUsername" placeholder="e.g. nurse1">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="newPassword" placeholder="min. 6 characters">
      </div>
      <div class="field">
        <label>Role</label>
        <select id="newRole">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div class="field">
        <button id="createUserBtn">Create User</button>
      </div>
    </div>
    <div class="status-banner" id="createBanner"></div>
  </div>

  <div class="card">
    <h2>Users</h2>
    <div class="table-scroll" style="max-height:none;">
      <table id="usersTable">
        <thead><tr><th>Username</th><th>Role</th><th>Created</th><th>Table Access</th><th>Actions</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const API = "/api/admin";
let allTables = [];
let currentUsername = null;

async function loadUsers() {
  const res = await fetch(`${API}/users`);
  const data = await res.json();
  const tbody = document.getElementById('usersBody');
  tbody.innerHTML = data.users.map(u => `
    <tr data-user-id="${u.user_id}">
      <td>${u.username}</td>
      <td>
        <select class="role-select" data-user-id="${u.user_id}" ${u.username === currentUsername ? 'disabled' : ''}>
          <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
        </select>
      </td>
      <td>${(u.created_at || '').slice(0, 10)}</td>
      <td>
        <button class="secondary access-btn" data-user-id="${u.user_id}" data-role="${u.role}" style="padding:6px 12px; font-size:11px;">
          ${u.role === 'admin' ? 'All tables' : 'Manage access'}
        </button>
      </td>
      <td>
        <button class="secondary reset-btn" data-user-id="${u.user_id}" style="padding:6px 12px; font-size:11px;">Reset Password</button>
        <button class="accent delete-btn" data-user-id="${u.user_id}" data-username="${u.username}" style="padding:6px 12px; font-size:11px;" ${u.username === currentUsername ? 'disabled' : ''}>Delete</button>
      </td>
    </tr>
  `).join('');

  tbody.querySelectorAll('.role-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      await fetch(`${API}/users/${sel.dataset.userId}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: sel.value }),
      });
      loadUsers();
    });
  });
  tbody.querySelectorAll('.reset-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pw = prompt('New password (min. 6 characters):');
      if (!pw) return;
      const res = await fetch(`${API}/users/${btn.dataset.userId}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      if (!res.ok) { const d = await res.json(); alert(d.detail || 'Failed'); }
    });
  });
  tbody.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm(`Delete user "${btn.dataset.username}"? This cannot be undone.`)) return;
      const res = await fetch(`${API}/users/${btn.dataset.userId}`, { method: 'DELETE' });
      if (!res.ok) { const d = await res.json(); alert(d.detail || 'Failed'); }
      loadUsers();
    });
  });
  tbody.querySelectorAll('.access-btn').forEach(btn => {
    btn.addEventListener('click', () => openAccessDialog(btn.dataset.userId, btn.dataset.role));
  });
}

async function openAccessDialog(userId, role) {
  if (role === 'admin') { alert('Admins always have access to every table.'); return; }
  const res = await fetch(`${API}/users/${userId}/table-access`);
  const data = await res.json();
  allTables = data.all_tables;
  const allowed = new Set(data.allowed_tables);

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(34,38,43,0.4); display:flex; align-items:center; justify-content:center; z-index:50;';
  overlay.innerHTML = `
    <div class="card" style="width:380px; margin:0;">
      <h2>Table Access</h2>
      <div id="tableChecks" style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
        ${allTables.map(t => `
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <input type="checkbox" value="${t}" ${allowed.has(t) ? 'checked' : ''}> ${t}
          </label>
        `).join('')}
      </div>
      <div class="actions">
        <button id="saveAccessBtn">Save</button>
        <button class="secondary" id="cancelAccessBtn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelAccessBtn').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#saveAccessBtn').addEventListener('click', async () => {
    const tables = [...overlay.querySelectorAll('#tableChecks input:checked')].map(i => i.value);
    await fetch(`${API}/users/${userId}/table-access`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tables }),
    });
    overlay.remove();
    loadUsers();
  });
}

document.getElementById('createUserBtn').addEventListener('click', async () => {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const role = document.getElementById('newRole').value;
  const banner = document.getElementById('createBanner');
  banner.className = 'status-banner';
  if (!username || !password) { return; }

  const res = await fetch(`${API}/users`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, role }),
  });
  const data = await res.json();
  if (res.ok) {
    banner.textContent = `Created user "${username}".`;
    banner.classList.add('show', 'success');
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    loadUsers();
  } else {
    banner.textContent = data.detail || 'Failed to create user.';
    banner.classList.add('show', 'fail');
  }
});

(async function init() {
  const res = await fetch('/api/auth/me');
  const data = await res.json();
  if (!data.authenticated) { window.location.href = '/login'; return; }
  if (data.role !== 'admin') { window.location.href = '/'; return; }
  currentUsername = data.username;
  const chip = document.getElementById('userChip');
  chip.innerHTML = `<span><b>${data.username}</b></span><span class="role-badge">${data.role}</span><button class="secondary" id="logoutBtn">Log Out</button>`;
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login';
  });
  loadUsers();
})();
</script>
</body>
</html>
